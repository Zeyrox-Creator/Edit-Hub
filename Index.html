
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090611">
<title>EDIT BY ZEYROX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090611;--panel:#151020;--line:#38264d;--purple:#923cff;--pink:#ed48d1}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
header{height:74px;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;background:#0d0917;border-bottom:1px solid #30203f;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand h2{font-size:18px;letter-spacing:1px}
.nav-btn,.back-btn{background:#191126;color:white;border:1px solid #7540a8;border-radius:9px;padding:10px 16px}
.page{display:none;min-height:calc(100vh - 74px);padding:32px 5%}
.page.active{display:block}
.hero{min-height:410px;border:1px solid #48266b;border-radius:24px;padding:40px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 0%,#7128a94a,transparent 65%),linear-gradient(135deg,#171023,#0a0711 75%);box-shadow:0 0 35px #8d37ff20}
.hero-logo{width:95px;height:95px;object-fit:contain;margin-bottom:18px}
.hero h1{font-size:clamp(34px,7vw,65px);font-weight:900}
.gradient{background:linear-gradient(90deg,#b66aff,#ed55d6,#6b9cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:17px;color:#d8c4ee;font-size:17px;letter-spacing:4px}
.explore{margin-top:30px;padding:15px 36px;border:0;border-radius:11px;color:white;font-weight:bold;background:linear-gradient(100deg,#853aff,#d93bd0);box-shadow:0 0 24px #9b3dff55}
.section-title{text-align:center;font-size:27px;margin:40px 0 24px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}
.category-card{min-height:155px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#151020;border:1px solid var(--line);border-radius:17px;text-align:center;cursor:pointer;transition:.2s}
.category-card:hover,.sub-card:hover{transform:translateY(-5px);border-color:#b15aff}
.category-icon{font-size:35px}
.category-card h3{font-size:18px}
.cat1 h3{color:#ff86cb}.cat2 h3{color:#b28cff}.cat3 h3{color:#67e9bb}.cat4 h3{color:#ffc16f}
.page-heading{display:flex;align-items:center;gap:15px;margin-bottom:30px}
.page-heading h2{font-size:25px}
.sub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.sub-card{min-height:180px;padding:27px;border:1px solid #ffffff25;border-radius:19px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:.2s}
.sub-card h3{font-size:27px;margin-bottom:12px}
.sub-card p{color:#eee}
.trending{background:linear-gradient(135deg,#60300d,#e18a25)}
.gaming{background:linear-gradient(135deg,#102b63,#167be7)}
.natural{background:linear-gradient(135deg,#12452a,#20a66b)}
.logo-card{background:linear-gradient(135deg,#472064,#b23bd1)}
.search{width:100%;padding:14px;margin-bottom:20px;background:#151020;border:1px solid #50366a;border-radius:10px;color:white;outline:none}
.search:focus{border-color:#b15aff}
.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{padding:18px;background:#151020;border:1px solid var(--line);border-radius:14px}
.item h3{margin-bottom:10px}
.item p{font-size:13px;color:#b9abc9;margin-bottom:10px}
.action{display:inline-block;padding:10px 14px;border:0;border-radius:8px;background:#853bd4;color:white;text-decoration:none;margin:4px 4px 0 0}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:#b9abc9}
.detail-box{padding:25px;background:#151020;border:1px solid var(--line);border-radius:15px}
.detail-box p{white-space:pre-wrap;line-height:1.6;margin:15px 0;color:#ddd}
footer{text-align:center;padding:24px;color:#9e8eaf;border-top:1px solid #30203f;margin-top:30px}
@media(max-width:750px){.category-grid{grid-template-columns:repeat(2,1fr)}.item-grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:350px}}
@media(max-width:480px){.sub-grid,.item-grid{grid-template-columns:1fr}.page{padding:24px 4%}.brand h2{font-size:15px}.brand img{width:39px;height:39px}.hero{min-height:330px}}
</style>
</head>

<body>
<header>
 <div class="brand">
  <img src="file_00000000e23c81fa9dfe6f55f7764bc5.png" alt="Logo">
  <h2>EDIT BY ZEYROX</h2>
 </div>
 <button class="nav-btn" onclick="showPage('home')">HOME</button>
</header>

<!-- HOME -->
<section id="home" class="page active">
 <div class="hero">
  <img class="hero-logo" src="file_00000000e23c81fa9dfe6f55f7764bc5.png" alt="Logo">
  <h1>EDIT BY <span class="gradient">ZEYROX</span></h1>
  <p class="tagline">EDIT LIKE A PRO</p>
  <button class="explore" onclick="showPage('categories')">EXPLORE NOW →</button>
 </div>
 <h2 class="section-title">EXPLORE CATEGORIES</h2>
 <div class="category-grid" id="homeCategories"></div>
</section>

<!-- CATEGORIES -->
<section id="categories" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('home')">← Back</button>
  <h2>Categories</h2>
 </div>
 <div class="category-grid" id="allCategories"></div>
</section>

<!-- SUBCATEGORIES -->
<section id="subcategories" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('categories')">← Back</button>
  <h2 id="categoryHeading">Subcategories</h2>
 </div>
 <div class="sub-grid">
  <div class="sub-card trending" onclick="openGallery('Trending')"><h3>🔥 Trending</h3><p>Explore trending edits</p></div>
  <div class="sub-card gaming" onclick="openGallery('Gaming')"><h3>🎮 Gaming</h3><p>Explore gaming edits</p></div>
  <div class="sub-card natural" onclick="openGallery('Natural')"><h3>🌿 Natural</h3><p>Explore natural edits</p></div>
  <div class="sub-card logo-card" onclick="openGallery('Logo')"><h3>💜 Logo</h3><p>Explore logo edits</p></div>
 </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('subcategories')">← Back</button>
  <h2 id="galleryHeading">Gallery</h2>
 </div>
 <input id="searchInput" class="search" type="search" placeholder="Search materials..." oninput="renderGallery()">
 <div class="item-grid" id="itemGrid"></div>
</section>

<!-- DETAIL -->
<section id="detail" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('gallery')">← Back</button>
  <h2>Material Details</h2>
 </div>
 <div class="detail-box">
  <h2 id="detailTitle"></h2>
  <p id="detailText"></p>
  <button class="action" onclick="copyCurrent()">Copy</button>
  <button class="action" onclick="shareCurrent()">Share</button>
 </div>
</section>

<footer>© 2026 EDIT BY ZEYROX</footer>

<script>
const categories=[
 {name:'AI Edit Prompt',icon:'✨',cls:'cat1'},
 {name:'AI Template',icon:'🎨',cls:'cat2'},
 {name:'PNG Material',icon:'🖼️',cls:'cat3'},
 {name:'VFX Material',icon:'⚡',cls:'cat4'}
];

function makeCategoryCards(target){
 document.getElementById(target).innerHTML=categories.map((c,i)=>`
  <div class="category-card ${c.cls}" onclick="openCategory(${i})">
   <div class="category-icon">${c.icon}</div><h3>${c.name}</h3>
  </div>`).join('');
}
makeCategoryCards('homeCategories');
makeCategoryCards('allCategories');

const materials=[
 {name:'Chaoten Kitty',category:'PNG Material',sub:'Trending',file:'materials/png/chaotenkitty-neon-7440942_1920.png',type:'image'},
 {name:'Fantasy Artwork',category:'PNG Material',sub:'Natural',file:'materials/png/geralt-art-7036652_1920.jpg',type:'image'},
 {name:'Technology Background',category:'PNG Material',sub:'Gaming',file:'materials/png/tungnguyen0905-technology-6701424_1920.jpg',type:'image'}
];

/*
ADD YOUR OWN CONTENT HERE.

Prompt example:
{
 name:'My Prompt',
 category:'AI Edit Prompt',
 sub:'Trending',
 text:'Write your complete prompt here.',
 type:'prompt'
}

Template example:
{
 name:'My Template',
 category:'AI Template',
 sub:'Trending',
 file:'materials/templates/my-template.jpg',
 type:'image'
}

VFX example:
{
 name:'My VFX',
 category:'VFX Material',
 sub:'Gaming',
 file:'materials/vfx/my-vfx.mp4',
 type:'file'
}
*/

let selectedCategory='';
let selectedSub='';
let currentItem=null;
let previousPage='gallery';

const pages=['home','categories','subcategories','gallery','detail'];

function showPage(id){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById(id).classList.add('active');
 window.scrollTo({top:0,behavior:'smooth'});
}

function openCategory(index){
 selectedCategory=categories[index].name;
 document.getElementById('categoryHeading').textContent=selectedCategory;
 showPage('subcategories');
}

function openGallery(sub){
 selectedSub=sub;
 document.getElementById('galleryHeading').textContent=selectedCategory+' / '+sub;
 document.getElementById('searchInput').value='';
 renderGallery();
 showPage('gallery');
}

function renderGallery(){
 const query=document.getElementById('searchInput').value.toLowerCase();
 const grid=document.getElementById('itemGrid');
 const list=materials.filter(x=>
  x.category===selectedCategory &&
  x.sub===selectedSub &&
  x.name.toLowerCase().includes(query)
 );
 grid.innerHTML='';

 if(!list.length){
  grid.innerHTML='<div class="empty">No materials added here yet.</div>';
  return;
 }

 list.forEach(item=>{
  const card=document.createElement('div');
  card.className='item';
  const title=document.createElement('h3');
  title.textContent=item.name;
  const desc=document.createElement('p');
  desc.textContent=item.category+' • '+item.sub;
  card.append(title,desc);

  if(item.type==='prompt'){
   const view=document.createElement('button');
   view.className='action';
   view.textContent='View Prompt';
   view.onclick=()=>openDetail(item);
   card.appendChild(view);
  }else{
   const link=document.createElement('a');
   link.className='action';
   link.href=item.file;
   link.download='';
   link.textContent='Download';
   card.appendChild(link);
   if(item.type==='image'){
    const view=document.createElement('button');
    view.className='action';
    view.textContent='View Details';
    view.onclick=()=>openDetail(item);
    card.appendChild(view);
   }
  }
  grid.appendChild(card);
 });
}

function openDetail(item){
 currentItem=item;
 previousPage='gallery';
 document.getElementById('detailTitle').textContent=item.name;
 document.getElementById('detailText').textContent=item.text||item.file||item.name;
 showPage('detail');
}

function copyCurrent(){
 if(!currentItem)return;
 copyText(currentItem.text||currentItem.name);
}

async function copyText(text){
 try{
  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{
   const input=document.createElement('textarea');
   input.value=text;
   document.body.appendChild(input);
   input.select();
   document.execCommand('copy');
   input.remove();
  }
  alert('Copied successfully!');
 }catch(e){alert('Copy failed. Please try again.');}
}

async function shareCurrent(){
 if(!currentItem)return;
 const text=currentItem.name+'\n'+(currentItem.text||currentItem.file||'');
 try{
  if(navigator.share){
   await navigator.share({title:currentItem.name,text});
  }else{
   await copyText(text);
  }
 }catch(e){}
}
</script>
</body>
</html>
