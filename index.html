
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090611">
<title>EDIT BY ZEYROX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090611;--panel:#151020;--line:#38264d;--purple:#923cff;--pink:#ed48d1}
body{background:var(--bg);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
header{height:74px;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;background:#0d0917;border-bottom:1px solid #30203f;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand h2{font-size:18px;letter-spacing:1px}
.nav-btn,.back-btn{background:#191126;color:white;border:1px solid #7540a8;border-radius:9px;padding:10px 16px}
.page{display:none;min-height:calc(100vh - 74px);padding:32px 5%}
.page.active{display:block}
.hero{min-height:410px;border:1px solid #48266b;border-radius:24px;padding:40px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 0%,#7128a94a,transparent 65%),linear-gradient(135deg,#171023,#0a0711 75%);box-shadow:0 0 35px #8d37ff20}
.hero-logo{width:95px;height:95px;object-fit:contain;margin-bottom:18px}
.hero h1{font-size:clamp(34px,7vw,65px);font-weight:900}
.gradient{background:linear-gradient(90deg,#b66aff,#ed55d6,#6b9cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:17px;color:#d8c4ee;font-size:17px;letter-spacing:4px}
.explore{margin-top:30px;padding:15px 36px;border:0;border-radius:11px;color:white;font-weight:bold;background:linear-gradient(100deg,#853aff,#d93bd0);box-shadow:0 0 24px #9b3dff55}
.section-title{text-align:center;font-size:27px;margin:40px 0 24px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}
.category-card{min-height:155px;padding:22px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#151020;border:1px solid var(--line);border-radius:17px;text-align:center;cursor:pointer;transition:.2s}
.category-card:hover,.sub-card:hover{transform:translateY(-5px);border-color:#b15aff}
.category-icon{font-size:35px}
.category-card h3{font-size:18px}
.cat1 h3{color:#ff86cb}.cat2 h3{color:#b28cff}.cat3 h3{color:#67e9bb}.cat4 h3{color:#ffc16f}
.page-heading{display:flex;align-items:center;gap:15px;margin-bottom:30px}
.page-heading h2{font-size:25px}
.sub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.sub-card{min-height:180px;padding:27px;border:1px solid #ffffff25;border-radius:19px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:.2s}
.sub-card h3{font-size:27px;margin-bottom:12px}
.sub-card p{color:#eee}
.trending{background:linear-gradient(135deg,#60300d,#e18a25)}
.gaming{background:linear-gradient(135deg,#102b63,#167be7)}
.natural{background:linear-gradient(135deg,#12452a,#20a66b)}
.logo-card{background:linear-gradient(135deg,#472064,#b23bd1)}
.search{width:100%;padding:14px;margin-bottom:20px;background:#151020;border:1px solid #50366a;border-radius:10px;color:white;outline:none}
.search:focus{border-color:#b15aff}
.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{padding:18px;background:#151020;border:1px solid var(--line);border-radius:14px}
.item h3{margin-bottom:10px}
.item p{font-size:13px;color:#b9abc9;margin-bottom:10px}
.action{display:inline-block;padding:10px 14px;border:0;border-radius:8px;background:#853bd4;color:white;text-decoration:none;margin:4px 4px 0 0}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:#b9abc9}
.detail-box{padding:25px;background:#151020;border:1px solid var(--line);border-radius:15px}
.detail-box p{white-space:pre-wrap;line-height:1.6;margin:15px 0;color:#ddd}
footer{text-align:center;padding:24px;color:#9e8eaf;border-top:1px solid #30203f;margin-top:30px}
@media(max-width:750px){.category-grid{grid-template-columns:repeat(2,1fr)}.item-grid{grid-template-columns:repeat(2,1fr)}.hero{min-height:350px}}
@media(max-width:480px){.sub-grid,.item-grid{grid-template-columns:1fr}.page{padding:24px 4%}.brand h2{font-size:15px}.brand img{width:39px;height:39px}.hero{min-height:330px}}
</style>
</head>

<body>
<header>
 <div class="brand">
  <img src="file_00000000e23c81fa9dfe6f55f7764bc5.png" alt="Logo">
  <h2>EDIT BY ZEYROX</h2>
 </div>
 <button class="nav-btn" onclick="showPage('home')">HOME</button>
</header>

<!-- HOME -->
<section id="home" class="page active">
 <div class="hero">
  <img class="hero-logo" src="file_00000000e23c81fa9dfe6f55f7764bc5.png" alt="Logo">
  <h1>EDIT BY <span class="gradient">ZEYROX</span></h1>
  <p class="tagline">EDIT LIKE A PRO</p>
  <button class="explore" onclick="showPage('categories')">EXPLORE NOW →</button>
 </div>
 <h2 class="section-title">EXPLORE CATEGORIES</h2>
 <div class="category-grid" id="homeCategories"></div>
</section>

<!-- CATEGORIES -->
<section id="categories" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('home')">← Back</button>
  <h2>Categories</h2>
 </div>
 <div class="category-grid" id="allCategories"></div>
</section>

<!-- SUBCATEGORIES -->
<section id="subcategories" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('categories')">← Back</button>
  <h2 id="categoryHeading">Subcategories</h2>
 </div>
 <div class="sub-grid">
  <div class="sub-card trending" onclick="openGallery('Trending')"><h3>🔥 Trending</h3><p>Explore trending edits</p></div>
  <div class="sub-card gaming" onclick="openGallery('Gaming')"><h3>🎮 Gaming</h3><p>Explore gaming edits</p></div>
  <div class="sub-card natural" onclick="openGallery('Natural')"><h3>🌿 Natural</h3><p>Explore natural edits</p></div>
  <div class="sub-card logo-card" onclick="openGallery('Logo')"><h3>💜 Logo</h3><p>Explore logo edits</p></div>
 </div>
</section>

<!-- GALLERY -->
<section id="gallery" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('subcategories')">← Back</button>
  <h2 id="galleryHeading">Gallery</h2>
 </div>
 <input id="searchInput" class="search" type="search" placeholder="Search materials..." oninput="renderGallery()">
 <div class="item-grid" id="itemGrid"></div>
</section>

<!-- DETAIL -->
<section id="detail" class="page">
 <div class="page-heading">
  <button class="back-btn" onclick="showPage('gallery')">← Back</button>
  <h2>Material Details</h2>
 </div>
 <div class="detail-box">
  <h2 id="detailTitle"></h2>
  <p id="detailText"></p>
  <button class="action" onclick="copyCurrent()">Copy</button>
  <button class="action" onclick="shareCurrent()">Share</button>
 </div>
</section>

<footer>© 2026 EDIT BY ZEYROX</footer>

<script>
const categories=[
 {name:'AI Edit Prompt',icon:'✨',cls:'cat1'},
 {name:'AI Template',icon:'🎨',cls:'cat2'},
 {name:'PNG Material',icon:'🖼️',cls:'cat3'},
 {name:'VFX Material',icon:'⚡',cls:'cat4'}
];

function makeCategoryCards(target){
 document.getElementById(target).innerHTML=categories.map((c,i)=>`
  <div class="category-card ${c.cls}" onclick="openCategory(${i})">
   <div class="category-icon">${c.icon}</div><h3>${c.name}</h3>
  </div>`).join('');
}
makeCategoryCards('homeCategories');
makeCategoryCards('allCategories');

const materials=[
 {name:'Chaoten Kitty',category:'PNG Material',sub:'Trending',file:'materials/png/chaotenkitty-neon-7440942_1920.png',type:'image'},
 {name:'Fantasy Artwork',category:'PNG Material',sub:'Natural',file:'materials/png/geralt-art-7036652_1920.jpg',type:'image'},
 {name:'Technology Background',category:'PNG Material',sub:'Gaming',file:'materials/png/tungnguyen0905-technology-6701424_1920.jpg',type:'image'},

 {
  name:'ZAI TREND A01',searchName:'A01',
  category:'AI Edit Prompt',sub:'Trending',
  file:'materials/ai-prompts/trending/ZAI-Trend-A01.jpg',
  type:'prompt',
  text:`Use the uploaded photo as the only subject reference and create a premium cinematic portrait collage poster in a vertical 9:16 composition. Preserve the person's facial identity, facial structure, hairstyle, beard, skin tone, and recognizable features as accurately as possible throughout every portrait.

Composition: Fill the upper background with an enormous dramatic close-up crop of the person's eyes and upper face, tinted deep crimson red. Across the middle, arrange five separate black-and-white portrait panels of the same person, each showing a different angle or expression. Use thin clean white borders around the panels; make the center panel slightly taller and place the other four panels symmetrically around it in a layered 2-1-2 arrangement. In the foreground, place one large realistic full-colour seated portrait of the same person, centered and overlapping the lower edges of the monochrome panels. The person sits confidently in a dark chair, wearing a fitted black formal suit over a black shirt, with one hand raised naturally near the chin and the other resting comfortably on the chair or lap.

Visual style: Deep crimson-red textured and subtly smoky background, dramatic red cinematic rim lighting, warm realistic skin tones on the foreground portrait, monochrome high-contrast middle panels, deep shadows, crisp facial details, realistic skin texture, detailed hair, professional studio lighting, premium movie-poster colour grading, polished Photoshop photo manipulation, clean layered depth, balanced spacing, sharp focus, and high-resolution finish.

Keep the overall framing, portrait-panel hierarchy, layered collage effect, and strong red-and-black visual mood consistent across the full poster. Do not change the person's identity or introduce other people. Do not add any name, typography, captions, logos, watermark, borders around the whole poster, extra objects, duplicated facial features, distorted hands, or artificial-looking skin.`
 },

 {
  name:'ZAI TREND A02',searchName:'A02',
  category:'AI Edit Prompt',sub:'Trending',
  file:'materials/ai-prompts/trending/ZAI-Trend-A02.jpg',
  type:'prompt',
  text:`Use my uploaded photo as the ONLY identity reference. Create a highly realistic cinematic 3-panel vertical photo collage in a 9:16 aspect ratio.

Top Panel: Show the same person standing near a beautiful outdoor balcony railing, photographed from behind at a three-quarter angle, one hand gently touching the back of the head, looking down to the side. Wear a light pink striped shirt with sleeves rolled up and black trousers.

Middle Panel: Create a close-up cinematic portrait of the same person, showing the face from a side angle, looking thoughtfully towards the left. Keep realistic facial details, natural hairstyle and soft expressions.

Bottom Panel: Show the same person in a medium full-body shot, standing confidently near the same balcony railing, looking towards the left, wearing the same pink striped shirt and black trousers.

Background & Style: Beautiful green garden, blurred trees, modern balcony, warm golden wall lights, subtle blue evening lighting, cinematic depth of field, natural skin texture, professional DSLR photography, soft bokeh and premium Instagram aesthetic.

IMPORTANT: All three panels must feature the exact same person from my uploaded photo. Preserve their original facial identity, face shape and recognizable features. Maintain consistent clothing and hairstyle across all three panels. Make it look like three real photographs taken during the same photoshoot.

No text, no watermark, no logo, no social media interface, ultra-realistic, high detail, professional photography, 4K quality.`
 },

 {
  name:'AESTHETIC DP (ZAI TREND A03)',searchName:'A03',
  category:'AI Edit Prompt',sub:'Trending',
  file:'materials/ai-prompts/trending/ZAI-Trend-A03.jpg',
  type:'prompt',
  text:`Transform my uploaded photo into a realistic professional night-flash portrait while preserving my exact facial identity and recognizable features.

Pose & Composition: Show me standing in a stylish natural pose, with my upper body slightly turned sideways and my face looking back towards the camera. One hand raised gently near my forehead, creating a fashionable pose. Capture a vertical full-body portrait in a 9:16 aspect ratio.

Outfit: Keep my original outfit from the uploaded photo, unless I specifically request a change.

Lighting: Create a powerful warm camera-flash effect from behind and slightly to the side, producing beautiful golden rim lighting around my hair, face, shoulders and body. Add soft front flash illumination on the face, realistic highlights and natural shadows.

Background: Dark nighttime outdoor background with subtle texture, deep black tones and a cinematic atmosphere. Keep the background uncluttered.

Photography Style: Premium Instagram night-flash photography, realistic skin texture, sharp facial details, natural colors, DSLR quality, dramatic contrast, subtle film grain and professional photo editing.

IMPORTANT: Use only the person in my uploaded photo. Preserve the original face, facial structure and identity. Do not replace the person with another model. Keep the result photorealistic.

No text, no watermark, no logo, no social media interface. Ultra-realistic, high-quality 4K portrait.`
 },

 {
  name:'STYLISH DP (ZAI TREND A04)',searchName:'A04',
  category:'AI Edit Prompt',sub:'Trending',
  file:'materials/ai-prompts/trending/ZAI-Trend-A04.jpg',
  type:'prompt',
  text:`Create a beautiful aesthetic Pinterest-style scrapbook photo collage using my uploaded photo as the ONLY identity reference.

Layout: Create a vertical 9:16 collage containing 8–9 photographs of the same person, arranged in different sizes with one large central close-up portrait and multiple smaller portraits surrounding it.

Outfit: A beautiful elegant black saree with a detailed golden embroidered border, matching blouse, delicate necklace, earrings and traditional accessories.

Photo Poses: Include different natural poses:
1. Full-body standing portrait.
2. Side-profile portrait looking down.
3. Sitting elegantly with one hand near the face.
4. Close-up portrait looking directly at the camera.
5. Smiling portrait with eyes gently closed.
6. Standing portrait holding the saree gracefully.
7. A candid thoughtful pose.

Scrapbook Design: Use an off-white vintage paper background with a subtle grid pattern. Add torn-paper photo borders, overlapping paper layers, small black bows, delicate butterflies, dried flowers, tiny handwritten-style decorative marks and subtle vintage scrapbook details. Keep the arrangement elegant, balanced and visually pleasing.

Color & Lighting: Soft warm natural lighting, muted beige and cream tones, gentle shadows, realistic skin tones and a subtle vintage film aesthetic.

Identity Preservation: All photographs must feature the exact same person from my uploaded photo. Preserve the original facial identity, face shape, skin tone and recognizable features. Maintain consistent facial appearance throughout all collage panels.

Quality: Highly realistic professional portrait photography, detailed textures, sharp facial features, premium Pinterest aesthetic, polished photo-editing finish and high-resolution 4K quality.

Restrictions: No text, no captions, no watermark, no logo, no social media interface, no unrelated people and no distorted facial features or hands.`
 }
];

/*
ADD YOUR OWN CONTENT HERE.

Prompt example:
{
 name:'My Prompt',
 category:'AI Edit Prompt',
 sub:'Trending',
 text:'Write your complete prompt here.',
 type:'prompt'
}

Template example:
{
 name:'My Template',
 category:'AI Template',
 sub:'Trending',
 file:'materials/templates/my-template.jpg',
 type:'image'
}

VFX example:
{
 name:'My VFX',
 category:'VFX Material',
 sub:'Gaming',
 file:'materials/vfx/my-vfx.mp4',
 type:'file'
}
*/

let selectedCategory='';
let selectedSub='';
let currentItem=null;
let previousPage='gallery';

const pages=['home','categories','subcategories','gallery','detail'];

function showPage(id){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById(id).classList.add('active');
 window.scrollTo({top:0,behavior:'smooth'});
}

function openCategory(index){
 selectedCategory=categories[index].name;
 document.getElementById('categoryHeading').textContent=selectedCategory;
 showPage('subcategories');
}

function openGallery(sub){
 selectedSub=sub;
 document.getElementById('galleryHeading').textContent=selectedCategory+' / '+sub;
 document.getElementById('searchInput').value='';
 renderGallery();
 showPage('gallery');
}

function renderGallery(){
 const query=document.getElementById('searchInput').value.toLowerCase();
 const grid=document.getElementById('itemGrid');
 const list=materials.filter(x=>
  x.category===selectedCategory &&
  x.sub===selectedSub &&
  x.name.toLowerCase().includes(query)
 );
 grid.innerHTML='';

 if(!list.length){
  grid.innerHTML='<div class="empty">No materials added here yet.</div>';
  return;
 }

 list.forEach(item=>{
  const card=document.createElement('div');
  card.className='item';
  const title=document.createElement('h3');
  title.textContent=item.name;
  const desc=document.createElement('p');
  desc.textContent=item.category+' • '+item.sub;
  card.append(title,desc);

  if(item.type==='prompt'){
   const view=document.createElement('button');
   view.className='action';
   view.textContent='View Prompt';
   view.onclick=()=>openDetail(item);
   card.appendChild(view);
  }else{
   const link=document.createElement('a');
   link.className='action';
   link.href=item.file;
   link.download='';
   link.textContent='Download';
   card.appendChild(link);
   if(item.type==='image'){
    const view=document.createElement('button');
    view.className='action';
    view.textContent='View Details';
    view.onclick=()=>openDetail(item);
    card.appendChild(view);
   }
  }
  grid.appendChild(card);
 });
}

function openDetail(item){
 currentItem=item;
 previousPage='gallery';
 document.getElementById('detailTitle').textContent=item.name;
 document.getElementById('detailText').textContent=item.text||item.file||item.name;
 showPage('detail');
}

function copyCurrent(){
 if(!currentItem)return;
 copyText(currentItem.text||currentItem.name);
}

async function copyText(text){
 try{
  if(navigator.clipboard && window.isSecureContext){
   await navigator.clipboard.writeText(text);
  }else{
   const input=document.createElement('textarea');
   input.value=text;
   document.body.appendChild(input);
   input.select();
   document.execCommand('copy');
   input.remove();
  }
  alert('Copied successfully!');
 }catch(e){alert('Copy failed. Please try again.');}
}

async function shareCurrent(){
 if(!currentItem)return;
 const text=currentItem.name+'\n'+(currentItem.text||currentItem.file||'');
 try{
  if(navigator.share){
   await navigator.share({title:currentItem.name,text});
  }else{
   await copyText(text);
  }
 }catch(e){}
}
</script>
</body>
</html>
