
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090611">
<title>EDIT BY ZEYROX</title>

<style>
:root{
  --bg:#090611;
  --panel:#171024;
  --panel2:#211632;
  --purple:#9b5cff;
  --text:#fff;
  --muted:#b9adc9;
  --border:#38264f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 5%;
  background:#120b1d;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:45px;height:45px;object-fit:contain}
.brand h2{font-size:18px;color:#c69aff}
.brand p{font-size:11px;color:var(--muted);margin-top:4px}
main{width:92%;max-width:1100px;margin:28px auto;min-height:65vh}
.page{display:none}
.page.active{display:block}
h1{font-size:27px;margin-bottom:8px}
.subtitle{color:var(--muted);margin-bottom:24px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:16px;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px 12px;
  text-align:center;
  min-height:135px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:10px;
  transition:.2s;
}
.card:hover{transform:translateY(-3px);border-color:var(--purple)}
.card .emoji{font-size:34px}
.card h3{font-size:16px}
.card p{font-size:12px;color:var(--muted)}
.page-header{
  display:grid;
  grid-template-columns:85px minmax(0,1fr) 85px;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
}
.page-header h2{text-align:center;font-size:20px}
.back,.action{
  padding:11px 14px;
  color:white;
  border:1px solid #7542a8;
  border-radius:9px;
  background:var(--panel2);
}
.back{justify-self:start;white-space:nowrap}
.back:hover,.action:hover{background:#713bb0}
.search{
  display:block;
  width:100%;
  padding:14px;
  margin:16px 0 20px;
  border:1px solid #69418e;
  border-radius:10px;
  background:var(--panel);
  color:white;
  font-size:15px;
  outline:none;
}
.search:focus{border-color:#b47aff}
.prompt-card{
  padding:0;
  overflow:hidden;
  text-align:left;
  display:block;
  width:100%;
  background:var(--panel);
  color:white;
  border:1px solid var(--border);
  border-radius:14px;
}
.prompt-card:hover{border-color:var(--purple)}
.prompt-card img{
  width:100%;
  height:145px;
  object-fit:cover;
  display:block;
}
.prompt-card h3{padding:13px;font-size:15px}
.prompt-card p{padding:0 13px 14px;color:var(--muted);font-size:12px}
.empty{
  text-align:center;
  padding:35px 12px;
  border:1px dashed #65438a;
  border-radius:12px;
  color:var(--muted);
  grid-column:1/-1;
}
.detail-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}
.detail-box img{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
  margin:15px 0;
}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}
.prompt-text{
  background:#0d0815;
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
  line-height:1.7;
  color:#e8dcf7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.material-card{padding:12px}
.material-card img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:9px;
}
.material-card h3{margin:10px 0}
footer{
  text-align:center;
  padding:25px 10px;
  color:var(--muted);
  border-top:1px solid var(--border);
  margin-top:40px;
  font-size:13px;
}
@media(max-width:450px){
  .brand h2{font-size:15px}
  .page-header{grid-template-columns:75px minmax(0,1fr) 75px}
  .page-header h2{font-size:17px}
  .back{padding:10px;font-size:13px}
  .grid{gap:11px}
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="file_00000000e23c81fa9dfe6f55f7764bc5.png" alt="EDIT BY ZEYROX Logo">
    <div>
      <h2>EDIT BY ZEYROX</h2>
      <p>Everything You Need to Edit Better.</p>
    </div>
  </div>
</header>

<main>

<!-- HOME -->
<section id="homePage" class="page active">
  <h1>Welcome to EDIT BY ZEYROX</h1>
  <p class="subtitle">Everything You Need to Edit Better.</p>
  <div class="grid" id="categoryGrid"></div>
</section>

<!-- SUBCATEGORIES -->
<section id="subcategoryPage" class="page">
  <div class="page-header">
    <button class="back" id="backHome">← Back</button>
    <h2 id="subcategoryTitle">Categories</h2>
    <span></span>
  </div>
  <div class="grid" id="subcategoryGrid"></div>
</section>

<!-- MATERIALS -->
<section id="materialsPage" class="page">
  <div class="page-header">
    <button class="back" id="backMaterials">← Back</button>
    <h2 id="materialsTitle">Materials</h2>
    <span></span>
  </div>
  <input id="materialSearch" class="search"
    type="search" placeholder="🔍 Search materials...">
  <div class="grid" id="materialsGrid"></div>
</section>

<!-- PROMPT GALLERY -->
<section id="galleryPage" class="page">
  <div class="page-header">
    <button class="back" id="backGallery">← Back</button>
    <h2 id="galleryTitle">Gaming</h2>
    <span></span>
  </div>

  <input id="promptSearch" class="search"
    type="search" placeholder="🔍 Search AI Prompts...">

  <div class="grid" id="promptGrid"></div>
</section>

<!-- PROMPT DETAIL -->
<section id="detailPage" class="page">
  <div class="page-header">
    <button class="back" id="backDetail">← Back</button>
    <h2>Prompt Details</h2>
    <span></span>
  </div>

  <div class="detail-box">
    <h2 id="detailTitle">Prompt</h2>
    <img id="detailImage" src="" alt="Prompt preview">

    <div class="actions">
      <button class="action" id="copyButton">📋 Copy Prompt</button>
      <button class="action" id="shareButton">↗ Share</button>
    </div>

    <div id="detailText" class="prompt-text"></div>
  </div>
</section>

</main>

<footer>
  © 2026 EDIT BY ZEYROX. All Rights Reserved.
</footer>

<script>

// ========== DATA ==========

const mainCategories = [
  {name:"AI Edit Prompt",icon:"🤖",desc:"Explore AI prompts"},
  {name:"AI Template",icon:"🎨",desc:"Explore templates"},
  {name:"PNG Material",icon:"🖼️",desc:"Explore PNG materials"},
  {name:"VFX Material",icon:"✨",desc:"Explore VFX materials"}
];

const subCategories = [
  {name:"Trending",icon:"🔥"},
  {name:"Gaming",icon:"🎮"},
  {name:"Natural",icon:"🌿"},
  {name:"Logo",icon:"💠"}
];

/*
ADD YOUR PROMPTS HERE.

Example:
{
  category:"Gaming",
  name:"Neon Gaming Portrait",
  image:"materials/png/chaotenkitty-neon-7440942_1920.png",
  text:"Write your AI prompt here."
}
*/

const prompts = [];

const materials = [
  {
    category:"PNG Material",
    name:"Neon Kitty",
    image:"materials/png/chaotenkitty-neon-7440942_1920.png"
  },
  {
    category:"PNG Material",
    name:"Fantasy Art",
    image:"materials/png/geralt-art-7036652_1920.jpg"
  },
  {
    category:"PNG Material",
    name:"Technology",
    image:"materials/png/tungnguyen0905-technology-6701424_1920.jpg"
  }
];

let selectedMain = "";
let selectedSub = "";
let currentPrompt = null;

// ========== NAVIGATION ==========

const pages = document.querySelectorAll(".page");

function showPage(page){
  pages.forEach(p=>p.classList.remove("active"));
  page.classList.add("active");
  window.scrollTo(0,0);
}

// ========== HOME CATEGORY CARDS ==========

const categoryGrid = document.getElementById("categoryGrid");

mainCategories.forEach(item=>{
  const card = document.createElement("button");
  card.className = "card";
  card.type = "button";

  card.innerHTML = `
    <div class="emoji">${item.icon}</div>
    <h3>${item.name}</h3>
    <p>${item.desc}</p>
  `;

  card.onclick = ()=>{
    selectedMain = item.name;
    document.getElementById("subcategoryTitle").textContent = item.name;

    const grid = document.getElementById("subcategoryGrid");
    grid.innerHTML = "";

    subCategories.forEach(sub=>{
      const subCard = document.createElement("button");
      subCard.className = "card";
      subCard.type = "button";

      subCard.innerHTML = `
        <div class="emoji">${sub.icon}</div>
        <h3>${sub.name}</h3>
        <p>Explore ${sub.name}</p>
      `;

      subCard.onclick = ()=>{
        selectedSub = sub.name;

        if(selectedMain === "AI Edit Prompt"){
          openGallery();
        }else{
          openMaterials();
        }
      };

      grid.appendChild(subCard);
    });

    showPage(document.getElementById("subcategoryPage"));
  };

  categoryGrid.appendChild(card);
});

// ========== AI PROMPT GALLERY ==========

function openGallery(){
  document.getElementById("galleryTitle").textContent = selectedSub;

  const search = document.getElementById("promptSearch");
  search.value = "";

  renderPrompts("");

  showPage(document.getElementById("galleryPage"));
}

function renderPrompts(searchValue){
  const grid = document.getElementById("promptGrid");
  grid.innerHTML = "";

  const query = searchValue.toLowerCase();

  const found = prompts.filter(item=>{
    const category = (item.category || "").toLowerCase();
    const name = (item.name || "").toLowerCase();
    const description = (item.text || "").toLowerCase();

    return category === selectedSub.toLowerCase() &&
      (name.includes(query) || description.includes(query));
  });

  if(found.length === 0){
    grid.innerHTML = `
      <div class="empty">
        <h3>${query ? "No matching prompts" : "No prompts added yet"}</h3>
        <p>${query ? "Try another search." : "New prompts will appear here soon!"}</p>
      </div>
    `;
    return;
  }

  found.forEach(item=>{
    const card = document.createElement("button");
    card.className = "prompt-card";
    card.type = "button";

    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.name || "Prompt image";

    const title = document.createElement("h3");
    title.textContent = item.name;

    const description = document.createElement("p");
    description.textContent = "Tap to view prompt";

    card.append(img,title,description);
    card.onclick = ()=>openDetail(item);

    grid.appendChild(card);
  });
}

// Search listener: attached once, outside gallery function.
document.getElementById("promptSearch").addEventListener("input",function(){
  renderPrompts(this.value.trim());
});

// Gallery Back → Subcategory page.
document.getElementById("backGallery").onclick = ()=>{
  showPage(document.getElementById("subcategoryPage"));
};

// ========== PROMPT DETAIL ==========

function openDetail(item){
  currentPrompt = item;

  document.getElementById("detailTitle").textContent = item.name;
  document.getElementById("detailImage").src = item.image;
  document.getElementById("detailText").textContent = item.text;

  showPage(document.getElementById("detailPage"));
}

// Detail Back → Gallery.
// Gallery is not re-rendered, so its search remains intact.
document.getElementById("backDetail").onclick = ()=>{
  showPage(document.getElementById("galleryPage"));
};

document.getElementById("copyButton").onclick = async ()=>{
  if(!currentPrompt)return;

  try{
    await navigator.clipboard.writeText(currentPrompt.text);
    alert("Prompt copied!");
  }catch(error){
    const area = document.createElement("textarea");
    area.value = currentPrompt.text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    alert("Prompt copied!");
  }
};

document.getElementById("shareButton").onclick = async ()=>{
  if(!currentPrompt)return;

  const shareData = {
    title:currentPrompt.name,
    text:currentPrompt.text,
    url:window.location.href
  };

  if(navigator.share){
    try{
      await navigator.share(shareData);
    }catch(error){}
  }else{
    try{
      await navigator.clipboard.writeText(
        currentPrompt.name + "\n\n" + currentPrompt.text
      );
      alert("Prompt details copied for sharing!");
    }catch(error){
      alert("Sharing is not supported on this device.");
    }
  }
};

// ========== MATERIALS ==========

function openMaterials(){
  document.getElementById("materialsTitle").textContent = selectedMain;
  document.getElementById("materialSearch").value = "";

  renderMaterials("");

  showPage(document.getElementById("materialsPage"));
}

function renderMaterials(searchValue){
  const grid = document.getElementById("materialsGrid");
  grid.innerHTML = "";

  const query = searchValue.toLowerCase();

  const found = materials.filter(item=>
    item.category === selectedMain &&
    item.name.toLowerCase().includes(query)
  );

  if(found.length === 0){
    grid.innerHTML = `
      <div class="empty">
        <h3>No materials added yet</h3>
        <p>New materials will appear here soon.</p>
      </div>
    `;
    return;
  }

  found.forEach(item=>{
    const card = document.createElement("div");
    card.className = "card material-card";

    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.name;

    const title = document.createElement("h3");
    title.textContent = item.name;

    const download = document.createElement("button");
    download.className = "action";
    download.textContent = "Download";

    download.onclick = ()=>{
      const link = document.createElement("a");
      link.href = item.image;
      link.download = item.image.split("/").pop();
      document.body.appendChild(link);
      link.click();
      link.remove();
    };

    card.append(img,title,download);
    grid.appendChild(card);
  });
}

document.getElementById("materialSearch").addEventListener("input",function(){
  renderMaterials(this.value.trim());
});

// ========== BACK BUTTONS ==========

document.getElementById("backHome").onclick = ()=>{
  showPage(document.getElementById("homePage"));
};

document.getElementById("backMaterials").onclick = ()=>{
  showPage(document.getElementById("subcategoryPage"));
};

</script>

</body>
</html>
